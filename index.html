<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>길을 잇고, 길을 짓다 — 2026 국가무형유산 이수자 기획전시</title>
<style>
  :root{
    --bg:#111111;
    --panel:#1b1b1b;
    --accent:#c99a4b;
    --text:#eee;
    --muted:#999;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    height:100%;
  }
  #topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    background:rgba(17,17,17,0.92); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid #2a2a2a;
  }
  #title{
    font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; max-width:55vw;
  }
  #pageControls{
    display:flex; align-items:center; gap:8px; font-size:13px;
  }
  #pageControls button{
    background:var(--panel); color:var(--text); border:1px solid #333;
    border-radius:6px; padding:6px 10px; font-size:15px; line-height:1;
  }
  #pageInput{
    width:44px; text-align:center; background:var(--panel); color:var(--text);
    border:1px solid #333; border-radius:6px; padding:6px 4px; font-size:13px;
  }
  #pageOf{ color:var(--muted); }
  #viewer{
    padding-top:56px; padding-bottom:24px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .pageWrap{
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  canvas{
    max-width:96vw; box-shadow:0 4px 18px rgba(0,0,0,0.5); background:#fff;
  }
  .pageNum{
    font-size:11px; color:var(--muted);
  }
  #loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; background:var(--bg); z-index:30;
  }
  .spinner{
    width:28px; height:28px; border:3px solid #333; border-top-color:var(--accent);
    border-radius:50%; animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading p{ color:var(--muted); font-size:13px; }
</style>
</head>
<body>

<div id="topbar">
  <div id="title">결, 시간의 흐름 속에서</div>
  <div id="pageControls">
    <button id="prevBtn" aria-label="이전 페이지">‹</button>
    <input id="pageInput" type="number" min="1" value="1">
    <span id="pageOf">/ -</span>
    <button id="nextBtn" aria-label="다음 페이지">›</button>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <p>도록을 불러오는 중…</p>
</div>

<div id="viewer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  const PDF_URL = "catalog_small.pdf"; // 같은 폴더에 있는 PDF 파일명
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const viewer = document.getElementById("viewer");
  const loading = document.getElementById("loading");
  const pageInput = document.getElementById("pageInput");
  const pageOf = document.getElementById("pageOf");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  let pdfDoc = null;
  let totalPages = 0;
  const pageEls = {}; // pageNum -> wrapper element
  const renderedSet = new Set();

  function getHashPage(){
    const m = location.hash.match(/page=(\d+)/);
    if(m){
      const n = parseInt(m[1], 10);
      if(n >= 1) return n;
    }
    return 1;
  }

  async function renderPage(num){
    if(renderedSet.has(num)) return;
    renderedSet.add(num);
    const page = await pdfDoc.getPage(num);
    const wrap = pageEls[num];
    const canvas = wrap.querySelector("canvas");
    const ctx = canvas.getContext("2d");

    const dpr = window.devicePixelRatio || 1;
    const cssWidth = Math.min(window.innerWidth * 0.96, 900);
    const baseViewport = page.getViewport({ scale: 1 });
    const scale = (cssWidth / baseViewport.width) * dpr;
    const viewport = page.getViewport({ scale });

    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = (viewport.width / dpr) + "px";
    canvas.style.height = (viewport.height / dpr) + "px";

    await page.render({ canvasContext: ctx, viewport }).promise;
  }

  function buildPagePlaceholders(){
    for(let i = 1; i <= totalPages; i++){
      const wrap = document.createElement("div");
      wrap.className = "pageWrap";
      wrap.id = "page-" + i;
      const canvas = document.createElement("canvas");
      const label = document.createElement("div");
      label.className = "pageNum";
      label.textContent = i + " / " + totalPages;
      wrap.appendChild(canvas);
      wrap.appendChild(label);
      viewer.appendChild(wrap);
      pageEls[i] = wrap;
    }
  }

  // 화면에 보이는(또는 곧 보일) 페이지만 렌더링
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const num = parseInt(entry.target.id.replace("page-", ""), 10);
        renderPage(num);
      }
    });
  }, { rootMargin: "600px 0px 600px 0px" });

  function goToPage(num){
    num = Math.max(1, Math.min(totalPages, num));
    pageInput.value = num;
    const target = pageEls[num];
    if(target){
      renderPage(num).then(() => {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
    history.replaceState(null, "", "#page=" + num);
  }

  prevBtn.addEventListener("click", () => goToPage(parseInt(pageInput.value, 10) - 1));
  nextBtn.addEventListener("click", () => goToPage(parseInt(pageInput.value, 10) + 1));
  pageInput.addEventListener("change", () => goToPage(parseInt(pageInput.value, 10) || 1));
  window.addEventListener("hashchange", () => goToPage(getHashPage()));

  pdfjsLib.getDocument({
    url: PDF_URL,
    cMapUrl: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/",
    cMapPacked: true,
    standardFontDataUrl: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/"
  }).promise.then(async (doc) => {
    pdfDoc = doc;
    totalPages = doc.numPages;
    pageOf.textContent = "/ " + totalPages;
    buildPagePlaceholders();
    Object.values(pageEls).forEach(el => observer.observe(el));

    loading.style.display = "none";

    const startPage = getHashPage();
    pageInput.value = Math.min(startPage, totalPages);
    // 초기 페이지와 그 주변을 렌더링 후 스크롤 이동
    await renderPage(pageInput.value);
    goToPage(parseInt(pageInput.value, 10));
  }).catch(err => {
    loading.innerHTML = "<p style='color:#e88'>PDF를 불러오지 못했습니다.<br>" + err.message + "</p>";
  });
</script>
</body>
</html>
